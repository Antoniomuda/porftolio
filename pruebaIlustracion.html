<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animación Estilo Javier Calleja</title>
    <style>
      /* Estilos base del contenedor */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f7f7f7;
        font-family: sans-serif;
      }

      .canvas {
        position: relative;
        width: 400px;
        height: 500px;
        background: white;
        border: 15px solid #fff;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          inset 0 0 10px rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* --- 1. La Nube Roja (Cuerpo) --- */
      /* Para el ejemplo usamos una forma CSS orgánica con sombras que imita volumen.
       Para producción real, aquí incrustarías el elemento <svg> con los trazos del artista. */
      .cuerpo-nube {
        position: absolute;
        width: 260px;
        height: 220px;
        background-color: #d62828;
        border-radius: 50% 60% 55% 45% / 50% 55% 45% 55%;
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.2),
          0 0 20px rgba(214, 40, 40, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        /* Animación de respiración/flotación */
        animation: flotar 4s ease-in-out infinite alternate;
      }

      @keyframes flotar {
        0% {
          transform: translateY(0) scale(1);
          border-radius: 50% 60% 55% 45% / 50% 55% 45% 55%;
        }
        100% {
          transform: translateY(-10px) scale(1.02);
          border-radius: 55% 55% 60% 50% / 55% 50% 55% 48%;
        }
      }

      /* --- 2. Los Ojos Gigantes --- */
      .ojo {
        position: relative;
        width: 95px;
        height: 95px;
        background: radial-gradient(
          circle at 50% 50%,
          #ffffff 60%,
          #b5b5b5 100%
        );
        border-radius: 50%;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Contenedor de la pupila para aplicar el parpadeo */
      .pupila-contenedor {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Animación de parpadeo */
        animation: parpadear 5s ease-in-out infinite;
        transform-origin: center;
      }

      .pupila-negra {
        position: relative;
        width: 60px;
        height: 60px;
        background-color: #111;
        border-radius: 50%;
        /* Animación para que mire a los lados de forma orgánica */
        animation: mirar 8s ease-in-out infinite;
      }

      /* Brillos blancos dentro del ojo (característicos de Calleja) */
      .pupila-negra::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 12px;
        width: 16px;
        height: 16px;
        background-color: white;
        border-radius: 50%;
      }

      .pupila-negra::after {
        content: "";
        position: absolute;
        bottom: 14px;
        right: 14px;
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 50%;
      }

      /* --- 3. Keyframes de Animaciones --- */

      /* Animación 1: Parpadeo (Escala vertical a 0) */
      @keyframes parpadear {
        0%,
        45%,
        47%,
        90%,
        92%,
        100% {
          transform: scaleY(1);
        }
        46%,
        91% {
          transform: scaleY(0); /* Ojo cerrado rápidamente */
        }
      }

      /* Animación 2: Movimiento de mirada aleatoria */
      @keyframes mirar {
        0%,
        20%,
        80%,
        100% {
          transform: translate(0, 0);
        }
        30%,
        45% {
          transform: translate(-6px, 2px); /* Mira a la izquierda */
        }
        55%,
        70% {
          transform: translate(6px, -2px); /* Mira a la derecha */
        }
      }

      /* --- 4. Las Gotas que Caen --- */
      .gotas-contenedor {
        position: absolute;
        bottom: 80px;
        width: 120px;
        height: 100px;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
      }

      .gota {
        width: 4px;
        height: 15px;
        background: #d62828;
        border-radius: 2px;
        opacity: 0;
        animation: caer 3s infinite linear;
      }

      /* Variación de tiempos para que no caigan juntas */
      .gota:nth-child(2) {
        background: #f77f00;
        animation-delay: 0.7s;
        animation-duration: 2.5s;
      }
      .gota:nth-child(3) {
        background: #fcbf49;
        animation-delay: 1.4s;
        animation-duration: 3.2s;
      }

      @keyframes caer {
        0% {
          transform: translateY(-20px);
          opacity: 0;
          height: 5px;
        }
        20% {
          opacity: 0.8;
          height: 18px;
        }
        80% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(80px);
          opacity: 0;
          height: 4px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Marco de la obra -->
    <div class="canvas">
      <!-- Personaje central -->
      <div class="cuerpo-nube">
        <!-- Ojo Izquierdo -->
        <div class="ojo">
          <div class="pupila-contenedor">
            <div class="pupila-negra"></div>
          </div>
        </div>

        <!-- Ojo Derecho -->
        <div class="ojo">
          <div class="pupila-contenedor">
            <div class="pupila-negra"></div>
          </div>
        </div>
      </div>

      <!-- Efecto de gotas inferiores -->
      <div class="gotas-contenedor">
        <div class="gota"></div>
        <div class="gota"></div>
        <div class="gota"></div>
      </div>
    </div>
  </body>
</html>
